<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academy Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Academy Management System</h1>
    <p>This page sends data to a C-based backend for student registration.</p>

    <form action="cgi-bin/academy.cgi" method="post">
      <label>Roll number</label>
      <input name="roll" required>

      <label>Name</label>
      <input name="name" required>

      <label>Class level</label>
      <input name="class_level" type="number" min="9" max="12" required>

      <label>Gender</label>
      <select name="gender">
        <option value="boys">Boys</option>
        <option value="girls">Girls</option>
      </select>

      <label>Section</label>
      <input name="section">

      <label>Phone</label>
      <input name="phone">

      <label>Remarks</label>
      <textarea name="remarks"></textarea>

      <button type="submit">Save student</button>
    </form>
  </main>
</body>
</html>
